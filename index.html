<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fichas D&D">
<meta name="theme-color" content="#0C1120">
<title>Stat Manager D&amp;D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
<style>
  :root{
    --bg:#0C1120; --card:#161D33; --soft:#1C2440; --line:rgba(237,241,248,.10);
    --text:#EDF1F8; --muted:#8A93AB; --moon:#E9D8A6; --moondim:#3A4160;
    --green:#7FB069; --red:#E56B6F; --blue:#9FC5E8; --ink:#1A1A10;
    --serif:'Iowan Old Style',Palatino,Georgia,serif;
    --sb:#F6EFDC; --sbtext:#2A1E12; --sbred:#7A200D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body.noscroll{overflow:hidden}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;color:inherit}
  button:disabled{opacity:.4;cursor:default}
  input,textarea,select{font-family:inherit;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:10px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  header>div:first-child{min-width:0}
  .name{font-family:var(--serif);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-h{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:7px;height:7px;border-radius:4px;background:var(--green);margin-left:6px;transition:background .3s;flex:none}
  .dot.saving{background:var(--moon)}
  main{padding:14px 14px 110px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .card.tight{padding:12px 14px}
  .card.sticky{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:5;box-shadow:0 8px 18px rgba(0,0,0,.25)}
  .hero{text-align:center}
  .h1{font-family:var(--serif);font-size:24px;margin-bottom:6px}
  .h2{font-family:var(--serif);font-size:22px;margin:0 30px 8px 0}
  .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--moon);opacity:.85;font-weight:600;margin:14px 0 4px}
  .row{display:flex;justify-content:space-between;align-items:center}
  .row.wrap{flex-wrap:wrap;justify-content:flex-start}
  .row.around{justify-content:space-around}
  .gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}
  .mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mb6{margin-bottom:6px}.mb10{margin-bottom:10px}
  .grow{flex:1}.center{text-align:center}.pad{padding:24px 0}.wide{width:100%}
  .muted{color:var(--muted)}.small{font-size:13px}.big18{font-size:18px}
  .green{color:var(--green)}.red{color:var(--red)}
  .serif17{font-family:var(--serif);font-size:17px}.serif18{font-family:var(--serif);font-size:18px}.serif20{font-family:var(--serif);font-size:20px}
  .hint{font-size:12px;color:var(--muted);line-height:1.45}
  .hint.warn{color:var(--red)}
  .hint p,p.hint{margin:4px 0}
  input[type=number]{width:64px;padding:8px 6px;font-size:17px;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .search{width:100%;padding:10px 12px;font-size:16px}
  textarea{width:100%;padding:10px;font-size:15px;line-height:1.4;resize:vertical}
  select{padding:9px 8px;font-size:16px;width:100%}
  /* números de vida */
  .hpline{display:flex;align-items:baseline;gap:8px;margin:10px 0 0}
  .hpnum{font-family:var(--serif);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
  .tempnum{font-size:20px;color:var(--blue)}
  .bar{height:6px;border-radius:3px;background:var(--moondim);overflow:hidden;margin:10px 0 14px}
  .bar.mt8{margin:8px 0 2px}
  .bar>div{height:100%;transition:width .25s}
  .amt{flex:1;padding:10px 0;border-radius:10px;font-size:15px;font-weight:600;background:var(--soft);border:1px solid var(--line)}
  .amt.on{background:var(--moon);color:var(--ink)}
  .big{flex:1;padding:15px 0;border-radius:12px;font-size:16px;font-weight:700;border:none;display:block}
  .big.wide{width:100%}
  .big.dmg{background:var(--red);color:#fff}
  .big.heal{background:var(--green);color:var(--bg)}
  .big.primary{background:var(--moon);color:var(--ink)}
  .big.soft{background:var(--soft);border:1px solid var(--line);font-weight:500}
  .tfbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .moon{background:none;border:none;padding:3px;line-height:0}
  .pips{display:flex;flex-wrap:wrap;justify-content:flex-end}
  .ghost{background:var(--soft);color:var(--moon);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
  .ghost.wide{width:100%;padding:11px}
  .stepbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--moon);font-size:22px;font-weight:600}
  .chip{padding:8px 12px;border-radius:999px;font-size:14px;line-height:1.2;background:var(--soft);border:1px solid var(--line)}
  .chip.sm{padding:6px 10px;font-size:13px}
  .chip.on{background:rgba(233,216,166,.16);color:var(--moon);border-color:rgba(233,216,166,.55)}
  .chip.bad{color:var(--red);border-color:rgba(229,107,111,.4)}
  .chip small{opacity:.7}
  .x{background:none;border:1px solid var(--line);color:var(--muted);font-size:13px;padding:5px 10px;border-radius:999px}
  .pm{width:46px;height:42px;border-radius:10px;border:none;font-size:20px}
  .pm.sm{width:36px;height:34px;font-size:18px}
  .pm.minus{background:rgba(229,107,111,.18);color:var(--red)}
  .pm.plus{background:rgba(127,176,105,.18);color:var(--green)}
  .cnt{font-family:var(--serif);font-size:19px;min-width:44px;text-align:center}
  .cnt small{font-size:13px;color:var(--muted)}
  .moonword{font-family:var(--serif);font-size:18px;color:var(--moon)}
  .linkish{background:none;border:none;padding:0;text-align:left}
  /* faixa de números */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:6px}
  .strip>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
  .strip span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .strip b{font-family:var(--serif);font-size:21px;font-weight:400}
  .conc{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(159,197,232,.12);
    border:1px solid rgba(159,197,232,.45);color:var(--blue);border-radius:12px;padding:9px 12px;font-size:14px}
  .conc button{background:none;border:1px solid rgba(159,197,232,.45);color:var(--blue);border-radius:999px;padding:5px 10px;font-size:13px}
  .form{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
  .res{padding:5px 0;gap:8px;min-height:38px}
  .rname{font-size:15px;flex:1;min-width:0}
  .rname small{display:block;font-size:11px;color:var(--muted)}
  /* abas segmentadas e listas */
  .seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:none;padding:9px 2px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--moon);color:var(--ink)}
  .modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
  .modes::-webkit-scrollbar{display:none}
  .modes .chip{white-space:nowrap;flex:none}
  .list{display:flex;flex-direction:column}
  .li{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);
    padding:11px 2px;text-align:left;font-size:15px}
  .li.static{cursor:default}
  .li.cur .lname{color:var(--moon)}
  .lname{flex:1;min-width:0}
  .lname small{color:var(--muted)}
  .lmeta{font-size:13px;color:var(--muted);text-align:right;max-width:48%}
  .chev{color:var(--muted);font-size:20px;line-height:1;transition:transform .2s;display:inline-block}
  .chev.open{transform:rotate(90deg)}
  .lbody{padding:8px 4px 12px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
  .lbody p{margin:0 0 8px}
  .desc p{margin:0 0 8px;font-size:14px;line-height:1.5}
  .meta{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:8px}
  .castrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;
    background:var(--soft);color:var(--muted);margin-left:4px;vertical-align:2px;border:1px solid var(--line)}
  .tag.c{color:var(--blue);border-color:rgba(159,197,232,.4)}
  .tag.r{color:#C8A2E8;border-color:rgba(200,162,232,.4)}
  .tag.g{color:var(--green);border-color:rgba(127,176,105,.45)}
  .attn{font-size:13px;color:var(--green)}
  .attn.bad{color:var(--red)}
  .coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
  .coins label{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
  .coins input{width:100%}
  .dsb{background:none;border:none;padding:5px}
  .ds{width:20px;height:20px;border-radius:10px;border:2px solid;display:block}
  /* magias */
  .srow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:2px 0}
  .pbox{width:24px;height:24px;flex:none;border-radius:12px;border:2px solid var(--moondim);background:none}
  .pbox.on{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 3px var(--card)}
  .pbox.fixed{border-style:dotted}
  .sname{flex:1;background:none;border:none;text-align:left;padding:10px 0;font-size:15px;color:var(--muted)}
  .srow.on .sname{color:var(--text)}
  /* bestiário */
  .crhead{font-family:var(--serif);font-size:17px;color:var(--moon);margin-bottom:2px}
  .mrow{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 2px}
  .mrow:last-child{border-bottom:none}
  .mname{display:block;font-size:15px}
  .mmeta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .statblock{background:var(--sb);color:var(--sbtext);border-radius:12px;padding:16px;font-size:14px;line-height:1.45;
    font-family:var(--serif)}
  .statblock .sbname{font-size:24px;color:var(--sbred);font-variant:small-caps;font-weight:700;line-height:1.1;padding-right:24px}
  .statblock .sbsub{font-style:italic;font-size:13px;margin-top:2px}
  .statblock hr{border:none;border-top:2px solid var(--sbred);opacity:.55;margin:8px 0}
  .statblock b{color:var(--sbred)}
  .statblock p{margin:6px 0}
  .statblock p b{color:var(--sbtext)}
  .statblock .sbh{font-size:18px;color:var(--sbred);font-variant:small-caps;border-bottom:1px solid var(--sbred);margin:12px 0 4px}
  .statblock .hint{color:#6B5A44}
  .abgrid{display:grid;grid-template-columns:repeat(6,1fr);text-align:center}
  .abgrid span{display:block;font-weight:700;color:var(--sbred);font-size:12px}
  .abgrid b{color:var(--sbtext);font-weight:400}
  .abgrid small{display:block;font-size:12px}
  /* ficha */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .fld input,.fld select{width:100%;padding:9px 10px;font-size:16px;text-align:left}
  .tlabel{display:block;font-size:12px;color:var(--muted);margin-top:10px}
  .tlabel textarea{margin-top:4px}
  .classrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .classrow input{padding:9px 10px;font-size:16px;width:100%}
  .classrow>.row{grid-column:1/-1;justify-content:flex-end}
  .lvlnum{font-family:var(--serif);font-size:26px;color:var(--moon);min-width:36px;text-align:center}
  .abgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .abil{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
  .abl{font-size:11px;letter-spacing:.1em;color:var(--muted)}
  .abm{font-family:var(--serif);font-size:24px;margin:2px 0}
  .saverow{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;
    border-bottom:1px solid var(--line);padding:10px 2px;font-size:15px;text-align:left}
  .check{width:14px;height:14px;border-radius:7px;border:2px solid var(--moon);display:inline-block;vertical-align:-2px;margin-right:10px}
  .check.on{background:var(--moon)}
  .check.exp{background:var(--green);border-color:var(--green)}
  .chk{display:flex;align-items:center;gap:6px;font-size:14px}
  .warnbox{border-color:rgba(233,216,166,.4)}
  .danger{padding:13px 0;border-radius:12px;background:rgba(229,107,111,.12);color:var(--red);border:1px solid rgba(229,107,111,.4);font-size:14px;width:100%}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .opt{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .opt b{font-size:15px;color:var(--moon);font-weight:600}
  .opt span{font-size:13px;color:var(--muted);line-height:1.4}
  /* navegação */
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(12,17,32,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
  nav button{flex:1;padding:11px 0 9px;background:none;border:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.on{color:var(--moon)}
  /* painel inferior */
  #sheet{display:none}
  #sheet.open{display:block;position:fixed;inset:0;z-index:50}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:var(--card);border-top-left-radius:20px;border-top-right-radius:20px;
    border:1px solid var(--line);max-width:600px;margin:0 auto;display:flex;flex-direction:column;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--moondim);margin:8px auto 0;flex:none}
  .sheet-x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:15px;z-index:2}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
  .sheet-body .card{padding:0;border:none;background:none}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--moondim);border-top-color:var(--moon);margin:0 auto 12px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#24304F;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.45;
    width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .25s;z-index:60}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(229,107,111,.6)}
  input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <div>
    <div class="name" id="cname">Stat Manager</div>
    <div class="sub-h" id="subtitle"></div>
  </div>
  <div style="display:flex;align-items:center;gap:4px;flex:none">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3a9 9 0 1 0 0 18 7 9 0 0 1 0-18z" fill="#E9D8A6" opacity=".8"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#E9D8A6"/></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3a9 9 0 1 1 0 18 7 9 0 0 0 0-18z" fill="#E9D8A6" opacity=".8"/></svg>
    <span class="dot" id="dot"></span>
  </div>
</header>

<main id="app"></main>

<nav>
  <button data-tab="combat" class="on">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg>
    Combate
  </button>
  <button data-tab="spells">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    Magias
  </button>
  <button data-tab="forms">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="6" cy="10" r="2"/><circle cx="10" cy="5.5" r="2"/><circle cx="14" cy="5.5" r="2"/><circle cx="18" cy="10" r="2"/><path d="M12 12c-3 0-5.5 3.5-5.5 6 0 1.5 1.2 2.5 2.7 2.2 1.1-.2 1.8-.7 2.8-.7s1.7.5 2.8.7c1.5.3 2.7-.7 2.7-2.2 0-2.5-2.5-6-5.5-6z"/></svg>
    Formas
  </button>
  <button data-tab="sheet">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Ficha
  </button>
</nav>

<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-pdf" data-kind="pdf" accept=".pdf,application/pdf">
<input type="file" id="file-xml" data-kind="xml">
<input type="file" id="file-json" data-kind="json" accept=".json,application/json,text/plain">

<script src="js/importers.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/actions.js"></script>
</body>
</html>
